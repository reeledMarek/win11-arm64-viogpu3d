# Requires toolchain/llvm-mingw/bin on PATH (set automatically by build_mesa.sh)
[binaries]
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
windres = 'aarch64-w64-mingw32-windres'
dlltool = 'llvm-dlltool'
pkg-config = 'false'

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
