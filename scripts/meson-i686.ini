# Requires toolchain/llvm-mingw/bin on PATH (set automatically by build_mesa.sh)
[binaries]
c = 'i686-w64-mingw32-clang'
cpp = 'i686-w64-mingw32-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
windres = 'i686-w64-mingw32-windres'
dlltool = 'llvm-dlltool'
pkg-config = 'false'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true
